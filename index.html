<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2B2B; --ink2:#5A5652; --muted:#8A847E; --line:#E9E2DA; --paper:#FBF6F1; --card:#FFFFFF;
  --terra:#E2603B; --terra-d:#B9472A; --salmon:#F4AA91; --salmon-l:#FCE7DE;
  --ok:#2F7D5B; --ok-l:#E3F2EA; --warn:#9A5B00; --warn-l:#FFF1D6; --blue:#2B5C8A; --blue-l:#E6EFF8;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--terra-d)}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}

/* splash */
#splash{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .6s ease, visibility .6s;cursor:pointer}
#splash.hide{opacity:0;visibility:hidden}
#splash svg{width:170px;height:auto;overflow:visible}
.sp-a{animation:spA .7s cubic-bezier(.2,.8,.2,1) both}
.sp-b{animation:spB .7s cubic-bezier(.2,.8,.2,1) .25s both}
.sp-i{animation:spI .6s ease .85s both;transform-origin:350px 270px}
@keyframes spA{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes spB{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes spI{0%{opacity:0;transform:scale(.9)}60%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.wordmark{display:flex;margin-top:22px;font-weight:800;font-size:54px;letter-spacing:-2px;color:var(--paper)}
.wordmark span{display:inline-block;animation:wm .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes wm{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tagline{color:var(--salmon);margin-top:8px;font-size:15px;animation:wm .6s ease 1.7s both}

/* layout */
header.top{position:sticky;top:0;z-index:20;background:rgba(251,246,241,.92);backdrop-filter:saturate(1.2);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-1px;background:none;border:0;padding:4px 0}
.brand svg{width:34px;height:auto}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main button{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--ink2);font-weight:600;min-height:40px}
nav.main button:hover{background:#F2EBE3}
nav.main button.on{background:var(--ink);color:var(--paper)}
main{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--ink);background:var(--card);font-weight:700;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.primary:hover{background:var(--terra-d);border-color:var(--terra-d)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.danger{border-color:#C2412D;color:#A3301E}
label.f{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--ink2)}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid #D9D0C6;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--terra);outline-offset:1px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.terra{background:var(--salmon-l);color:var(--terra-d)}
.pill.gray{background:#F0EBE5;color:var(--ink2)}
.pill.blue{background:var(--blue-l);color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.rec{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
hr.s{border:0;border-top:1px solid var(--line);margin:16px 0}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin-bottom:28px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero-logo{display:flex;justify-content:center;padding:20px}
.hero-logo svg{width:min(300px,70vw);height:auto;overflow:visible}
.bob-a{animation:bobA 5s ease-in-out infinite}
.bob-b{animation:bobB 5s ease-in-out infinite}
.glow{animation:glow 5s ease-in-out infinite}
@keyframes bobA{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-6px)}}
@keyframes bobB{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,6px)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.82}}
.hero h1{font-size:40px;letter-spacing:-1.5px}
@media (max-width:820px){.hero h1{font-size:30px}}
.role-card{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;cursor:pointer}
.role-card:hover{border-color:var(--terra)}
.role-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list-item:first-child{border-top:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--salmon-l);color:var(--terra-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}

/* toggles */
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tg:first-of-type{border-top:0}
.switch{position:relative;width:46px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:#D8CFC5;border-radius:999px;transition:.2s}
.switch span:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--terra)}
.switch input:checked+span:after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--terra);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#F2EBE3;font-size:13px;font-weight:600}
.chip button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:16px;line-height:1;min-width:24px;min-height:24px}

/* code */
.code{font-size:44px;font-weight:800;letter-spacing:4px;color:var(--terra);font-variant-numeric:tabular-nums}
.msgbox{background:#F6F0E9;border-radius:12px;padding:14px;white-space:pre-wrap;font-size:14px}

/* consent */
.consent{max-width:640px;margin:0 auto}
.consent h3{margin-top:16px;margin-bottom:4px}
.consent .hl{background:var(--salmon-l);border-radius:12px;padding:14px;margin-top:8px}

/* room */
.room-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.room{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(320px,1fr);gap:14px;align-items:start}
.room.wide{grid-template-columns:minmax(0,1fr)}
.room.wide .video{aspect-ratio:16/8.2}
@media (max-width:960px){.room{grid-template-columns:minmax(0,1fr)}#bWide{display:none}.room .video{aspect-ratio:4/3}.caption{font-size:12px;right:86px;padding:6px 10px}.video .self{width:70px;height:50px}}
.tabs{display:flex;gap:4px;background:#F0EBE5;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--ink2);min-height:38px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabp{display:none;flex-direction:column;gap:12px}
.tabp.on{display:flex}
.tabs button .badge{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.video{position:relative;background:#1F1E1D;border-radius:var(--r);aspect-ratio:16/10;overflow:hidden;display:flex;align-items:center;justify-content:center}
.video video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.video .tagtl{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.video .self{position:absolute;right:10px;bottom:10px;width:92px;height:64px;border-radius:10px;background:#3A3836;border:1px solid #555;color:#bbb;font-size:12px;display:flex;align-items:center;justify-content:center}
.demo-face{width:44%;max-width:260px}
.breathe{animation:breathe 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.015) translateY(-2px)}}
.caption{position:absolute;left:12px;right:110px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;min-height:20px}
.caption:empty{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel-h h3{font-size:15px}
.transcript{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:14px;scroll-behavior:smooth}
.tl{padding:6px 8px;border-radius:8px}
.tl b{font-weight:700}
.tl .ts{color:var(--muted);font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
.tl.flag{background:var(--warn-l)}
.tl.interim{color:var(--muted);font-style:italic}
.bars{display:grid;grid-template-columns:72px minmax(0,1fr) 34px;gap:6px 8px;align-items:center;font-size:12px}
.bar{height:8px;background:#F0EBE5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--terra);border-radius:99px;transition:width .25s}
.ind{border-top:1px solid var(--line);padding:9px 0;font-size:13px}
.ind:first-child{border-top:0}
.ind.inc{background:var(--warn-l);border-radius:10px;padding:9px 10px;border-top:0;margin-bottom:4px}
.ask{background:var(--blue-l);border-radius:var(--r);padding:14px;color:#173A5E}
.ask .q{font-size:16px;font-weight:700;margin:4px 0 6px}
.cl{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 4px;text-align:left;border-top:1px solid var(--line);min-height:44px}
.cl:first-child{border-top:0}
.cl .st{width:22px;height:22px;border-radius:50%;border:2px solid #CFC6BC;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.cl.and .st{border-color:var(--warn);color:var(--warn)}
.cl.ok .st{border-color:var(--ok);background:var(--ok);color:#fff}
.qitem{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.qitem:first-child{border-top:0}
.qitem.done{color:var(--muted);text-decoration:line-through}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.disclaimer{font-size:12px;color:var(--muted);margin-top:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:800}

/* parecer */
.md h3{margin:16px 0 6px;font-size:16px}
.md ul{margin:6px 0;padding-left:20px}
.md p{margin:6px 0}
.timeline{position:relative;height:46px;background:#F6F0E9;border-radius:10px;margin-top:8px}
.timeline .ev{position:absolute;top:8px;width:10px;height:30px;border-radius:4px;transform:translateX(-50%)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.comp{border-top:1px solid var(--line);padding:14px 0}
.comp:first-of-type{border-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg button{border:1px solid #D9D0C6;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;min-height:40px}
.seg button.on.tem{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.melhorar{background:#B26B00;border-color:#B26B00;color:#fff}
.seg button.on.nao{background:#A3301E;border-color:#A3301E;color:#fff}
.sug{background:#F6F0E9;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px}
.sug q{display:block;font-style:italic;color:var(--ink2);margin-top:4px}
.lv{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.lv.tem{background:var(--ok-l);color:var(--ok)}
.lv.melhorar{background:var(--warn-l);color:var(--warn)}
.lv.nao{background:#FBE4E0;color:#A3301E}
.lv.sem{background:#F0EBE5;color:var(--ink2)}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th,table.cmp td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{font-size:12px;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(30,28,26,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#modal.on{display:flex}
#modal .card{max-width:440px;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.cand nav.main{display:none}
body.cand .brand{pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ---------- constantes ---------- */
const EMO = {
  alegria:{nome:'Alegria',cor:'#E9A23B',au:'Bochechas elevadas + cantos da boca para cima (AU6 + AU12)',dica:'Explore o que gerou entusiasmo: "O que mais te motivou nessa experiência?"'},
  tristeza:{nome:'Tristeza',cor:'#5C7FA3',au:'Parte interna das sobrancelhas erguida + cantos da boca para baixo (AU1 + AU15)',dica:'Acolha e aprofunde: "Como foi esse momento para você?"'},
  surpresa:{nome:'Surpresa',cor:'#7A6BB0',au:'Sobrancelhas erguidas + olhos arregalados + boca aberta (AU1 + AU2 + AU5 + AU26)',dica:'Verifique se a pergunta foi inesperada e dê espaço: "Fique à vontade para pensar."'},
  medo:{nome:'Medo',cor:'#3E8E8A',au:'Sobrancelhas erguidas e unidas + lábios esticados (AU1 + AU2 + AU4 + AU20)',dica:'Reduza a pressão e peça um exemplo: "Me conte uma situação parecida que você já viveu."'},
  raiva:{nome:'Raiva',cor:'#C2412D',au:'Sobrancelhas abaixadas + lábios pressionados (AU4 + AU23)',dica:'Investigue o incômodo: "O que mais te incomodou nessa situação?"'},
  nojo:{nome:'Nojo',cor:'#6E8B3D',au:'Nariz franzido + lábio superior erguido (AU9 + AU10)',dica:'Investigue a rejeição: "O que você mudaria nesse cenário?"'},
  desprezo:{nome:'Desprezo',cor:'#8A5A44',au:'Canto da boca erguido de um lado só (AU14 unilateral)',dica:'Peça um exemplo concreto: "Me conte uma situação específica em que vocês discordaram."'}
};
const NEG = ['tristeza','medo','raiva','nojo','desprezo'];
const POS_WORDS = ['tranquilo','tranquila','ótimo','ótima','muito bem','se deu bem','me dou bem','adoro','amo','nunca tive problema','sempre','perfeito','excelente','tudo certo','sem problema','super'];
const FEATURES = [
  ['roteiro','Roteiro por vaga','IA monta perguntas por competência','antes'],
  ['curriculo','Leitura do currículo','Aponta lacunas e pontos a confirmar','antes'],
  ['convite','Convite com código','Mensagem pronta para e-mail ou WhatsApp','antes'],
  ['gravacao','Gravação e transcrição','Transcrição ao vivo da conversa','durante'],
  ['ekman','Painel Ekman','Indícios das 7 emoções básicas','durante'],
  ['incongruencia','Alerta de incongruência','Fala positiva + expressão negativa','durante'],
  ['rapport','Abertura e rapport','Agradecimento e quebra-gelo no início','durante'],
  ['sugestoes','Perguntas sugeridas','Copiloto sugere a próxima pergunta','durante'],
  ['checklist','Checklist de competências','O que já foi coberto e o que falta','durante'],
  ['marcacao','Marcação rápida','Suas observações com um toque','durante'],
  ['cronometro','Cronômetro por bloco','Ritmo por competência','durante'],
  ['parecer','Parecer no seu modelo','IA preenche cada tópico durante a entrevista','depois'],

  const lines=esc(s).split('\n');let out='',inUl=false;
  for(const l of lines){

  if(!draft) draft=newDraft(null);
  const editing=!!draft.id;
  const grp=(k,t)=>`<div class="card"><h3 style="margin-bottom:6px">${t}</h3>${FEATURES.filter(f=>f[3]===k).map(f=>`<div class="tg"><div><b style="font-size:14px">${f[1]}</b><div class="xs muted">${f[2]}</div></div><label class="switch"><input type="checkbox" data-ft="${f[0]}" ${draft.features[f[0]]?'checked':''} aria-label="${f[1]}"><span></span></label></div>`).join('')}</div>`;
  app.innerHTML=`
  <div class="row" style="margin-bottom:16px"><h1 style="flex:1">${editing?'Editar vaga':'Nova vaga'}</h1>${editing?`<button class="btn sm ghost" id="bCancel">Cancelar</button>`:''}</div>
  <div class="grid2" style="align-items:start">
    <div class="stack">
      <div class="card stack">
        <div><label class="f" for="fVaga">Nome da vaga</label><input id="fVaga" type="text" placeholder="Analista de RH Pleno" value="${esc(draft.nome)}"></div>
        <div><label class="f" for="fDesc">Descrição da vaga</label><textarea id="fDesc" placeholder="Cole aqui a descrição da vaga">${esc(draft.descricao)}</textarea></div>
        <div class="row"><button class="btn sm" id="bRoteiro">${icon('spark')} Gerar roteiro com IA</button><span class="xs muted">Monta competências e perguntas a partir da vaga</span></div>
      </div>
      <div class="card stack">
        <h3>Ordem da entrevista</h3>
        <p class="xs muted">1. Pessoal → 2. Formação → 3. Experiências → 4. Competências → 5. Livre. Uma pergunta por linha.</p>
        ${[['pessoal','1. Pessoal'],['formacao','2. Formação'],['experiencia','3. Experiências']].map(([k,t])=>`<div><label class="f" for="et_${k}">${t}</label><textarea id="et_${k}" data-et="${k}" style="min-height:90px;font-size:14px">${esc((draft.etapas[k]||[]).join('\n'))}</textarea></div>`).join('')}
        <p class="xs muted">No bloco pessoal, foque em quem a pessoa é e no que a motiva. Evite perguntas sobre estado civil, filhos, religião ou saúde (Lei 9.029/95).</p>
      </div>
      <div class="card stack">
        <div class="row"><h3>4. Competências</h3><span class="spacer"></span><button class="btn sm ghost" id="bAddComp">+ Competência</button></div>
        <div id="comps"></div>
      </div>
      <div class="card stack"><label class="f" for="et_livre" style="font-size:16px;color:var(--ink);font-weight:700">5. Livre</label><textarea id="et_livre" data-et="livre" style="min-height:80px;font-size:14px">${esc((draft.etapas.livre||[]).join('\n'))}</textarea></div>
    </div>
    <div class="stack">
      <div class="card"><label class="f" for="fTpl">Modelo de parecer</label><select id="fTpl">${S.templates.map(t=>`<option value="${t.id}" ${draft.templateId===t.id?'selected':''}>${esc(t.nome)}${t.padrao&&!/padrão/i.test(t.nome)?' (padrão)':''}</option>`).join('')}</select><p class="xs muted" style="margin-top:6px">A IA preenche os tópicos desse modelo durante a entrevista. <button class="btn sm ghost" data-go="modelos" style="margin-left:4px">Gerenciar modelos</button></p></div>
      <p class="small muted">Escolha o que usar nas entrevistas desta vaga. O que estiver desligado não aparece na sala.</p>
      ${grp('antes','Antes')}${grp('durante','Durante')}${grp('depois','Depois')}
      <p id="vErr" class="small" style="color:#A3301E;min-height:18px"></p>
      <button class="btn primary" id="bSalvarVaga" style="width:100%">${editing?'Salvar vaga':'Criar vaga'}</button>
      ${editing?'<p class="xs muted">As mudanças valem para os próximos candidatos cadastrados. Quem já foi cadastrado mantém o roteiro que recebeu.</p>':''}
    </div>
  </div>`;
  const sync=()=>{draft.nome=$('#fVaga').value;draft.descricao=$('#fDesc').value;$('#vErr').textContent=''};
  ['#fVaga','#fDesc'].forEach(s=>$(s).addEventListener('input',sync));
  $('#fTpl').addEventListener('change',e=>draft.templateId=e.target.value);
  app.querySelectorAll('[data-et]').forEach(t=>t.addEventListener('input',()=>{draft.etapas[t.dataset.et]=t.value.split('\n').map(x=>x.trim()).filter(Boolean)}));
  app.querySelectorAll('[data-ft]').forEach(c=>c.addEventListener('change',()=>{draft.features[c.dataset.ft]=c.checked}));
  renderComps();
  const bc=$('#bCancel'); if(bc) bc.onclick=()=>{const id=draft.id;draft=null;go('vaga',id)};
  $('#bAddComp').onclick=()=>{draft.competencias.push({nome:'Nova competência',perguntas:['']});renderComps()};
  $('#bRoteiro').onclick=async e=>{
    sync(); const b=e.currentTarget; if(!draft.nome&&!draft.descricao){$('#vErr').textContent='Preencha o nome ou a descrição da vaga.';return}
    b.innerHTML='<span class="spin"></span> Gerando…';b.disabled=true;
    try{
      const r=await ai(`Você é especialista em recrutamento por competências no Brasil. Para a vaga "${draft.nome}" com a descrição abaixo, defina de 4 a 6 competências essenciais e, para cada uma, 3 perguntas comportamentais (método STAR), em português do Brasil, curtas e abertas. Não repita perguntas de trajetória ou formação, que já ficam em outros blocos.\nDescrição: ${draft.descricao}\nResponda só em JSON: {"competencias":[{"nome":"...","perguntas":["...","...","..."]}]}`,true);
      if(r&&Array.isArray(r.competencias)){draft.competencias=r.competencias.map(c=>({nome:String(c.nome),perguntas:(c.perguntas||[]).map(String)}));renderComps();toast('Roteiro gerado')}
    }catch(err){aiErr(err)}
    b.innerHTML=icon('spark')+' Gerar roteiro com IA';b.disabled=false;
  };
  $('#bSalvarVaga').onclick=()=>{
    sync(); if(!draft.nome.trim()){$('#vErr').textContent='Dê um nome para a vaga.';$('#fVaga').focus();return}
    const data={nome:draft.nome.trim(),descricao:draft.descricao,competencias:draft.competencias.filter(c=>c.nome.trim()).map(c=>({nome:c.nome.trim(),perguntas:c.perguntas.filter(q=>q.trim())})),etapas:draft.etapas,features:{...draft.features},templateId:draft.templateId};
    let id=draft.id;
    if(id){const v=S.vagas.find(x=>x.id===id);Object.assign(v,data);S.interviews.filter(i=>i.vagaId===id).forEach(i=>i.vaga=v.nome)}
    else{id='v'+Date.now();S.vagas.push({id,createdAt:Date.now(),...data})}
    save(); draft=null; toast('Vaga salva'); go('vaga',id);
  };
}
function renderComps(){
  const box=$('#comps'); if(!box)return;
  box.innerHTML=draft.competencias.map((c,ci)=>`<div style="border-top:1px solid var(--line);padding-top:10px">
    <div class="row"><input type="text" value="${esc(c.nome)}" data-cn="${ci}" aria-label="Nome da competência" style="font-weight:700;flex:1"><button class="btn sm ghost" data-crm="${ci}" aria-label="Remover competência">Remover</button></div>
    ${c.perguntas.map((q,qi)=>`<input type="text" value="${esc(q)}" data-cq="${ci}:${qi}" aria-label="Pergunta" style="margin-top:6px;font-size:14px">`).join('')}
    <button class="btn sm ghost" data-cqa="${ci}" style="margin-top:6px">+ Pergunta</button></div>`).join('');
  box.querySelectorAll('[data-cn]').forEach(i=>i.oninput=()=>draft.competencias[+i.dataset.cn].nome=i.value);
  box.querySelectorAll('[data-cq]').forEach(i=>i.oninput=()=>{const[a,b]=i.dataset.cq.split(':');draft.competencias[+a].perguntas[+b]=i.value});
  box.querySelectorAll('[data-crm]').forEach(b=>b.onclick=()=>{draft.competencias.splice(+b.dataset.crm,1);renderComps()});
  box.querySelectorAll('[data-cqa]').forEach(b=>b.onclick=()=>{draft.competencias[+b.dataset.cqa].perguntas.push('');renderComps()});
}
function cvHTML(c){if(!c)return '';return `<div class="msgbox" style="white-space:normal"><b>${esc(c.resumo||'')}</b>${(c.lacunas||[]).length?`<div class="small" style="margin-top:8px"><b>Lacunas</b><ul style="margin:4px 0;padding-left:18px">${c.lacunas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${(c.confirmar||[]).length?`<div class="small"><b>Confirmar na entrevista</b><ul style="margin:4px 0;padding-left:18px">${c.confirmar.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>`}

/* ---------- VAGA (detalhe + candidatos) ---------- */
let candDraft=null;
function vVaga(){

  if(!candDraft||candDraft.vagaId!==v.id) candDraft={vagaId:v.id,nome:'',curriculo:'',cv:null,open:false};
  const cs=S.interviews.filter(i=>i.vagaId===v.id).sort((a,b)=>b.createdAt-a.createdAt);
  app.innerHTML=`
  <div class="row" style="margin-bottom:6px"><button class="btn sm ghost" data-go="home">← Vagas</button></div>
  <div class="row" style="margin-bottom:16px"><div style="flex:1;min-width:220px"><h1>${esc(v.nome)}</h1><div class="muted small">${v.competencias.length} competências · ${cs.length} candidato${cs.length===1?'':'s'}</div></div>

    <div><label class="f" for="cNome">Nome completo</label><input id="cNome" type="text" placeholder="Ana Souza" value="${esc(candDraft.nome)}"></div>
    ${v.features.curriculo?`<div><label class="f" for="cCv">Currículo (opcional)</label><textarea id="cCv" placeholder="Cole o texto do currículo ou envie um arquivo">${esc(candDraft.curriculo)}</textarea></div>
    <div class="row"><label class="btn sm ghost" style="cursor:pointer">Enviar arquivo (.txt ou .docx)<input type="file" accept=".txt,.docx,text/plain" id="cCvFile" class="sr"></label><button class="btn sm" id="bCv">${icon('spark')} Analisar currículo</button></div>
    <div id="cvOut">${cvHTML(candDraft.cv)}</div>`:''}
    <p id="cnErr" class="small" style="color:#A3301E;min-height:18px"></p>

  <div class="card">

    ${cs.length?cs.map(i=>`<div class="list-item"><span class="avatar">${initials(i.candidato)}</span><div style="flex:1;min-width:160px"><b>${esc(i.candidato)}</b><div class="small muted">código ${esc(i.code)}${i.parecerFinal?' · '+esc(i.parecerFinal):''}</div></div>${stPill(i)}${i.consent?`<span class="pill ${i.consent==='full'?'ok':'blue'}">${i.consent==='full'?'Análise autorizada':'Só gravação'}</span>`:''}
      <div class="row">${i.status==='concluida'?`<button class="btn sm" data-go="parecer" data-id="${i.id}">Ver parecer</button>`:`<button class="btn sm" data-go="convite" data-id="${i.id}">Convite</button><button class="btn sm dark" data-go="sala" data-id="${i.id}">Abrir sala</button>`}</div></div>`).join(''):'<p class="muted small">Nenhum candidato ainda. Clique em "Adicionar candidato".</p>'}
  </div>
  <div class="card row" style="margin-top:16px"><div style="flex:1;min-width:200px"><b class="small">Link do candidato</b><div class="xs muted" style="word-break:break-all">${esc(candLink())}</div></div><button class="btn sm" id="hCopy">${icon('copy')} Copiar link</button><button class="btn sm ghost" id="hTest">Ver como candidato</button></div>`;
  $('#hCopy').onclick=()=>copy(candLink()); $('#hTest').onclick=()=>{location.hash='entrar'};
  $('#bEditVaga').onclick=()=>{draft=newDraft(v);go('nova','edit')};

/* ---------- CONVITE ---------- */
function vConvite(){
  const i=cur(); if(!i)return go('home');
  const msg=`Olá, ${i.candidato.split(' ')[0]}! Tudo bem?\n\nSua entrevista para a vaga de ${i.vaga} na ${S.settings.empresa} acontecerá pelo Nuance.\n\nNo horário combinado, acesse o link abaixo e informe o código da sua sala:\n\n${candLink()}\n\nCódigo: ${i.code}\n\nAntes de entrar, você verá como a entrevista será registrada e poderá escolher o que autoriza.\n\nAté breve!`;
  app.innerHTML=`<div class="row" style="margin-bottom:6px"><button class="btn sm ghost" data-go="vaga" data-id="${i.vagaId||''}">← ${esc(i.vaga)}</button></div><div class="row" style="margin-bottom:16px"><h1>Candidato cadastrado</h1></div>
  <div class="grid2" style="align-items:start">
    <div class="card stack" style="align-items:flex-start">
      <span class="small muted">Código da sala de ${esc(i.candidato)}</span>
      <div class="code">${esc(i.code)}</div>
      <div class="row"><button class="btn sm" id="cCode">${icon('copy')} Copiar código</button><span class="pill gray" id="onSt">Publicando sala online…</span></div>
      <hr class="s" style="width:100%">
      <div class="row" style="width:100%"><button class="btn dark" data-go="sala" data-id="${i.id}">Abrir sala do recrutador</button><button class="btn ghost" id="cTest">Ver como candidato</button></div>
    </div>
    ${i.features.convite?`<div class="card stack"><h3>Mensagem de convite</h3><div class="msgbox">${esc(msg)}</div><div class="row"><button class="btn sm primary" id="cMsg">${icon('copy')} Copiar mensagem</button><span class="xs muted">Cole no e-mail ou WhatsApp</span></div></div>`:''}
  </div>`;
  $('#cCode').onclick=()=>copy(i.code);
  $('#cTest').onclick=()=>{location.hash='entrar'};
  publishRoom(i).then(()=>{const p=$('#onSt');if(p){p.className='pill ok';p.textContent='Sala online ativa por 3 dias'}}).catch(()=>{const p=$('#onSt');if(p){p.className='pill warn';p.textContent='Sala só local: use pelo link do site'}});
  const m=$('#cMsg'); if(m) m.onclick=()=>copy(msg);
}

/* ---------- CANDIDATO ---------- */
function vCandidato(){
  app.innerHTML=`<div class="card stack" style="max-width:440px;margin:30px auto;text-align:center;align-items:center">
    <div style="width:90px">${logoSVG('cdClip')}</div>
    <h2>Entrar na entrevista</h2><p class="muted small">Digite o código que você recebeu do recrutador.</p>
    <label class="sr" for="cCodeIn">Código</label>
    <input id="cCodeIn" type="text" placeholder="NU-7Q4K" style="text-align:center;font-size:22px;font-weight:800;letter-spacing:3px;text-transform:uppercase" autocomplete="off">
    <p id="cErr" class="small" style="color:#A3301E;min-height:20px"></p>
    <button class="btn primary" id="cGo" style="width:100%">Continuar</button>
    ${isCand()?'':'<p class="xs muted">Teste com o código NU-7Q4K</p>'}
  </div>`;
  const inp=$('#cCodeIn'); inp.focus();
  inp.addEventListener('input',()=>$('#cErr').textContent='');
  const goNext=()=>{
    let v=inp.value.trim().toUpperCase().replace(/\s/g,''); if(v&&!v.startsWith('NU-'))v='NU-'+v.replace(/^NU/,'');
    if(!v){$('#cErr').textContent='Digite o código.';return}
    const btn=$('#cGo'); btn.innerHTML='<span class="spin"></span> Procurando sala…'; btn.disabled=true;
    rpc('nuance_get_room',{p_code:v}).then(r=>{const row=r&&r[0]; if(!row) throw {nf:true};
      candRoom={id:'remote_'+row.code,remote:true,code:row.code,candidato:row.candidato_nome,vaga:row.vaga,empresa:row.empresa,contato:row.contato,retencao:row.retencao,features:{ekman:row.analise,gravacao:row.gravacao},consent:null};
      curId=candRoom.id; go('aceite');
    }).catch(err=>{
      const i=S.interviews.find(x=>x.code===v&&x.status!=='concluida');
      if(i){curId=i.id;go('aceite');return}
      btn.innerHTML='Continuar'; btn.disabled=false;
      $('#cErr').textContent=err&&err.nf?'Código não encontrado ou sala expirada. Confira com o recrutador.':'Não consegui verificar o código agora. Confira a internet e tente de novo.';
    });
  };
  $('#cGo').onclick=goNext; inp.addEventListener('keydown',e=>{if(e.key==='Enter')goNext()});
}
function vAceite(){
  const i=cur(); if(!i)return go('candidato'); const st=i.remote?{empresa:i.empresa,contato:i.contato,retencao:i.retencao}:S.settings;
  const analise=i.features.ekman;
  app.innerHTML=`<div class="card consent">
    <h2>Antes de começar sua entrevista</h2>
    <p style="margin-top:10px">Olá, ${esc(i.candidato.split(' ')[0])}! Esta entrevista faz parte do processo seletivo conduzido por <b>${esc(st.empresa)}</b> para a vaga de <b>${esc(i.vaga)}</b>. Para tornar o processo mais organizado e justo, o recrutador usa uma plataforma de apoio.</p>
    ${i.features.gravacao?`<h3>Gravação e transcrição</h3><p>A entrevista será gravada e transcrita, para que o recrutador possa revisar suas respostas com atenção depois.</p>`:''}
    ${analise?`<div class="hl"><h3 style="margin-top:0">Análise de expressões</h3><p>Com sua autorização, a plataforma interpreta expressões faciais e linguagem corporal com base nos estudos de Paul Ekman sobre emoções. Essa análise gera apenas <i>indícios</i> para ajudar o recrutador a entender melhor a conversa e a fazer boas perguntas. <b>Ela não aprova nem reprova ninguém</b>: a decisão é sempre do recrutador, com base no conjunto do processo. Se você não autorizar, a entrevista acontece normalmente, sem nenhum prejuízo para você.</p></div>`:''}
    <h3>Seus dados</h3><p>As gravações e análises ficam guardadas por até ${esc(st.retencao)} dias e são acessadas apenas pela equipe de recrutamento. Você pode pedir uma cópia ou a exclusão a qualquer momento pelo e-mail ${esc(st.contato)}. Tratamento conforme a LGPD (Lei 13.709/2018).</p>
    <div class="stack" style="margin-top:20px">
      ${analise?`<button class="btn primary" id="aFull">${icon('check')} Autorizo a análise e quero entrar</button><button class="btn" id="aBasic">Entrar sem a análise de expressões</button>`:`<button class="btn primary" id="aBasic">${icon('check')} Entendi e quero entrar</button>`}
    </div>
    <p class="xs muted" style="margin-top:12px">Versão do termo ${CONSENT_VERSION}. Sua escolha fica registrada com data e hora.</p>
  </div>`;

function now(){return room?room.elapsed:0}
function tick(){
  if(!room)return; const i=cur(); if(!i)return;
  if(room.running){room.elapsed+=.25;
    if(room.mode==='demo') demoStep();
  }
  // decaimento dos níveis no modo demo
  if(room.mode==='demo'){for(const k in room.levels){room.levels[k]*=.9}; drawBars(); animateFace()}
  const tt=$('#totTime'); if(tt) tt.textContent=fmt(room.elapsed);
  const bt=$('#blkTime'); if(bt) bt.textContent=fmt(room.elapsed-room.blockT0);
}
function toggleDemo(){
  if(room.mode!=='demo'){toast('Desligue a câmera para usar a demonstração');return}
  room.running=!room.running;
  $('#bPlay').innerHTML=room.running?icon('pause')+' Pausar':icon('play')+' Continuar demonstração';
}
function demoStep(){
  const i=cur();
  while(room.demoIdx<DEMO.length&&DEMO[room.demoIdx].t<=room.elapsed){
    const ev=DEMO[room.demoIdx++];
    if(ev.end){room.running=false;$('#bPlay').innerHTML=icon('play')+' Demonstração concluída';$('#cap').textContent='';toast('Demonstração concluída. Encerre para ver o parecer.');continue}
    if(ev.text){addLine(ev.who,ev.text); $('#cap').textContent=(ev.who==='C'?'Ana: ':'Você: ')+ev.text;
      if(ev.who==='R'){markAskedByText(ev.text)}}
    if(ev.comp){const c=i.competencias.find(x=>x.nome===ev.comp[0]); if(c&&c.status!=='ok'){c.status=ev.comp[1]==='ok'?'ok':'andamento';renderChecklist();save()}}
    if(ev.emo&&i.features.ekman&&i.consent==='full'){room.levels[ev.emo]=Math.max(room.levels[ev.emo],ev.v);addIndicio(ev.emo,ev.v,ev.dur)}
  }
}
function animateFace(){
  const m=$('#mouth'); if(!m)return; const L=room.levels;
  const smile=L.alegria*10, frown=(L.tristeza+L.medo)*8, open=L.surpresa*10;
  const asym=L.desprezo*10;
  m.setAttribute('d',`M84 ${92-asym*0.2} Q100 ${100+smile-frown+open} 116 ${92-asym}`);
  const bu=(L.surpresa+L.medo+L.tristeza)*8, bd=L.raiva*6;
  $('#browL').setAttribute('d',`M78 ${64-bu+bd} L92 ${62-bu*1.2+bd*1.6}`);
  $('#browR').setAttribute('d',`M108 ${62-bu*1.2+bd*1.6} L122 ${64-bu+bd}`);
}
function drawBars(){
  for(const k in EMO){const b=$('#b_'+k);if(!b)return;const v=Math.min(1,room.levels[k]);b.style.width=(v*100).toFixed(0)+'%';$('#p_'+k).textContent=Math.round(v*100)+'%'}
}
function addLine(who,text,interim){
  const i=cur(); if(!i.features.gravacao&&!interim){i.transcript.push({t:now(),who,text});save();return}
  if(interim){const tr=$('#tr');if(!tr)return;let el=$('#interim');if(!el){el=document.createElement('div');el.id='interim';el.className='tl interim';tr.appendChild(el)}el.textContent=text;tr.scrollTop=tr.scrollHeight;return}
  const ie=$('#interim'); if(ie) ie.remove();
  i.transcript.push({t:now(),who,text}); save(); renderTranscript();
  if(room&&room.liveOn&&who==='C'&&i.transcript.filter(l=>l.who==='C').length-room.liveCount>=2) liveUpdate();
}
function renderLive(){
  const box=$('#liveBox'); if(!box)return; const i=cur(); const t=tplOf(i);
  box.innerHTML=t.secoes.filter(s=>s.ativa).map(s=>{const tx=(i.secoes||{})[s.id];return `<div style="border-top:1px solid var(--line);padding:8px 0"><b class="small">${esc(s.titulo)}</b><div class="small ${tx?'':'muted'}" style="margin-top:2px">${tx?esc(tx):'Aguardando informações…'}</div></div>`}).join('');
}
async function liveUpdate(force){
  if(!room||room.liveLoading)return; const i=cur(); const st=$('#liveSt');
  room.liveLoading=true; if(st) st.innerHTML='<span class="spin" style="width:12px;height:12px"></span> atualizando';
  room.liveCount=i.transcript.filter(l=>l.who==='C').length;
  await fillSections(i,null,true);
  if(room){room.liveLoading=false} if(st) st.textContent='atualizado '+fmt(now()); renderLive(); if(room&&room.flagTab) room.flagTab('par');
}
function ctxText(i){
  return `Cargo avaliado: ${i.vaga}\nDescrição da vaga: ${i.descricao||'-'}\nCurrículo: ${i.curriculo||'-'}\nCompetências: ${i.competencias.map(c=>c.nome+' ('+(c.nivel?NIVEL[c.nivel]:c.status)+')').join('; ')}\nObservações do recrutador: ${i.marks.map(m=>fmt(m.t)+' '+m.label+(m.note?' - '+m.note:'')).join('; ')||'nenhuma'}\nTranscrição:\n${i.transcript.map(l=>`[${fmt(l.t)}] ${l.who==='C'?'Candidato':'Recrutador'}: ${l.text}`).join('\n')||'(sem transcrição)'}`;
}
async function fillSections(i,onlyId,live){
  const t=tplOf(i); i.secoes=i.secoes||{};
  const secs=t.secoes.filter(s=>s.ativa&&(!onlyId||s.id===onlyId));
  try{
    const r=await ai(`Você redige pareceres de avaliação de candidatos para uma equipe de RH no Brasil. Preencha os tópicos do modelo abaixo com base SOMENTE no contexto da entrevista. ${live?'A entrevista ainda está em andamento: atualize os tópicos com o que já se sabe e deixe vazio ("") o tópico sem informação suficiente.':'A entrevista terminou: escreva o texto final de cada tópico.'}
Nome do candidato: ${i.candidato}
Guia de estilo da empresa: ${t.estilo}
${SENSITIVE_RULE}
Não invente fatos. Não decida aprovação ou reprovação.
Tópicos (título: o que escrever):
${secs.map(s=>`- ${s.titulo}: ${s.instrucao}`).join('\n')}
Texto atual dos tópicos (melhore e complete, sem perder o que já está correto):
${secs.map(s=>`- ${s.titulo}: ${i.secoes[s.id]||'(vazio)'}`).join('\n')}
Contexto:
${ctxText(i)}
Responda só em JSON: {"topicos":[{"titulo":"título exato","texto":"..."}]}`,true);
    if(!r||!Array.isArray(r.topicos)) throw {code:'bad'};
    r.topicos.forEach(x=>{const s=secs.find(s=>s.titulo.toLowerCase()===String(x.titulo||'').toLowerCase());if(s&&typeof x.texto==='string'&&(x.texto.trim()||!live))i.secoes[s.id]=x.texto.trim()});
  }catch(e){
    if(!live||!fillSections._warned){aiErr(e);fillSections._warned=true}
    fallbackSections(i,secs);
  }
  save();

function scoreEkman(b){
  const g=k=>b[k]||0, avg=(...k)=>k.reduce((s,x)=>s+g(x),0)/k.length;
  const smile=avg('mouthSmileLeft','mouthSmileRight'), cheek=avg('cheekSquintLeft','cheekSquintRight');
  const frown=avg('mouthFrownLeft','mouthFrownRight'), browIn=g('browInnerUp'), browOut=avg('browOuterUpLeft','browOuterUpRight');
  const browDown=avg('browDownLeft','browDownRight'), eyeWide=avg('eyeWideLeft','eyeWideRight'), eyeSq=avg('eyeSquintLeft','eyeSquintRight');
  const sneer=avg('noseSneerLeft','noseSneerRight'), upper=avg('mouthUpperUpLeft','mouthUpperUpRight');
  const stretch=avg('mouthStretchLeft','mouthStretchRight'), press=avg('mouthPressLeft','mouthPressRight');
  const raw={
    alegria:Math.min(1,smile*0.75+cheek*0.6),
    tristeza:Math.min(1,browIn*0.6+frown*0.9)*(1-smile),
    surpresa:Math.min(1,(browIn+browOut)*0.35+eyeWide*0.5+g('jawOpen')*0.45)*(1-browDown),
    medo:Math.min(1,browIn*0.4+eyeWide*0.6+stretch*0.7)*(1-smile),
    raiva:Math.min(1,browDown*0.8+eyeSq*0.3+press*0.5)*(1-smile),
    nojo:Math.min(1,sneer*0.9+upper*0.6),
    desprezo:Math.min(1,Math.abs(g('mouthSmileLeft')-g('mouthSmileRight'))*1.8+Math.abs(g('mouthDimpleLeft')-g('mouthDimpleRight'))*1.2)
  };
  const t=performance.now();
  for(const k in raw){
    room.levels[k]=room.levels[k]*0.6+raw[k]*0.4; const v=room.levels[k];
    const a=room.active[k];
    if(v>0.45&&!a) room.active[k]={start:t,peak:v};
    else if(a){a.peak=Math.max(a.peak,v); if(v<0.3){const dur=t-a.start; if(dur>120) addIndicio(k,a.peak,dur); delete room.active[k]}}
  }
  drawBars();
}

    const off=await pc.createOffer(); await pc.setLocalDescription(off); o.sig.send({t:'offer',sdp:pc.localDescription.toJSON()});
  }else if(p.t==='answer'&&o.pc){try{await o.pc.setRemoteDescription(p.sdp)}catch(e){}}

/* candidato */
async function candStart(i){
  const st=$('#cStatus'); candStop();
  const rt=candRT={pc:null,sig:null,stream:null,recog:null,helloT:null,dc:null};
  try{rt.stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:true})}catch(e){st.textContent='Libere a câmera e o microfone no navegador e toque em "Tentar de novo".';$('#cRetry').style.display='';return}
  if(candRT!==rt){rt.stream.getTracks().forEach(t=>t.stop());return}
  const lv=$('#lv'); lv.srcObject=rt.stream;
  try{rt.sig=await joinChannel(i.code,p=>onCandMsg(i,rt,p))}catch(e){st.textContent='Não consegui conectar à sala. Verifique a internet e tente de novo.';$('#cRetry').style.display='';return}
  st.textContent='Você está na sala. Aguardando o recrutador…';
  const hello=()=>{if(!rt.pc||rt.pc.connectionState!=='connected')rt.sig.send({t:'hello',consent:i.consent})};
  hello(); rt.helloT=setInterval(hello,3000);
  if(i.features.gravacao) candSpeech(rt);
}
async function onCandMsg(i,rt,p){
  if(candRT!==rt)return;
  if(p.t==='offer'){
    if(rt.pc){try{rt.pc.close()}catch(e){}}
    const pc=new RTCPeerConnection(ICE); rt.pc=pc;
    rt.stream.getTracks().forEach(t=>pc.addTrack(t,rt.stream));
    pc.ondatachannel=e=>{rt.dc=e.channel};
    pc.onicecandidate=e=>{if(e.candidate)rt.sig.send({t:'ice',to:'R',c:e.candidate.toJSON()})};
    pc.ontrack=e=>{const v=$('#rv');if(v&&v.srcObject!==e.streams[0]){v.srcObject=e.streams[0];v.play().catch(()=>{});$('#cvWait').style.display='none';$('#cStatus').textContent='Conectado com o recrutador.'}};
    pc.onconnectionstatechange=()=>{const s=$('#cStatus');if(!s)return;if(pc.connectionState==='failed')s.textContent='A conexão falhou. Se estiver na rede de uma empresa, tente pelo 4G.';if(pc.connectionState==='disconnected')s.textContent='Conexão interrompida. Tentando reconectar…'};
    await pc.setRemoteDescription(p.sdp); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans);
    rt.sig.send({t:'answer',sdp:pc.localDescription.toJSON()});
  }else if(p.t==='ice'&&p.to==='C'&&rt.pc){try{await rt.pc.addIceCandidate(p.c)}catch(e){}}
  else if(p.t==='bye'){const w=$('#cvWait');if(w)w.style.display='flex';const s=$('#cStatus');if(s)s.textContent='O recrutador saiu da chamada.';const v=$('#rv');if(v)v.srcObject=null}
}
function candSpeech(rt){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR)return;
  const r=new SR(); r.lang='pt-BR'; r.continuous=true; r.interimResults=true; rt.recog=r;
  const send=(text,final)=>{if(rt.dc&&rt.dc.readyState==='open')rt.dc.send(JSON.stringify({t:'tx',text,final}))};
  r.onresult=e=>{let interim='';for(let k=e.resultIndex;k<e.results.length;k++){const res=e.results[k];if(res.isFinal)send(res[0].transcript.trim(),true);else interim+=res[0].transcript}if(interim)send(interim,false)};
  r.onend=()=>{if(candRT===rt&&!r._stop){try{r.start()}catch(e){}}};
  try{r.start()}catch(e){}
}
function candStop(){
  const rt=candRT; if(!rt)return; candRT=null;
  clearInterval(rt.helloT);
  try{rt.sig&&rt.sig.send({t:'bye'})}catch(e){}
  if(rt.recog){rt.recog._stop=true;try{rt.recog.stop()}catch(e){}}
  try{rt.pc&&rt.pc.close()}catch(e){} try{rt.sig&&rt.sig.close()}catch(e){}
  if(rt.stream)rt.stream.getTracks().forEach(t=>t.stop());
}

async function suggestLevels(i,btn){

  try{
    const r=await ai(`Você avalia competências em entrevistas comportamentais no Brasil. Com base SOMENTE nas respostas do candidato na transcrição abaixo, sugira para cada competência um nível:
- "tem": deu exemplo concreto, com ação própria e resultado;
- "melhorar": mostra a competência, mas de forma parcial, genérica, sem resultado claro ou com pouca experiência;
- "nao": as respostas indicam ausência da competência ou comportamento contrário;

Vaga: ${i.vaga}
Competências: ${i.competencias.map(c=>c.nome).join(', ')}
Transcrição:
${tr||'(vazia)'}
Responda só em JSON: {"avaliacoes":[{"competencia":"nome exato","nivel":"tem|melhorar|nao|sem","justificativa":"1 a 2 frases","evidencia":"citação curta e literal do candidato, ou vazio"}]}`,true);
    if(r&&Array.isArray(r.avaliacoes))apply(r.avaliacoes); else throw {code:'bad'};
  }catch(e){

    apply(i.competencias.map(c=>{const lines=i.transcript.filter(l=>l.who==='C');

  }

  app.innerHTML=`<div class="row" style="margin-bottom:16px"><h1>Comparar candidatos</h1></div>
  <div class="card stack">
    <div style="max-width:360px"><label class="f" for="cmpV">Vaga</label><select id="cmpV">${vagas.map(v=>`<option value="${v.id}" ${v.id===sel?'selected':''}>${esc(v.nome)}</option>`).join('')}</select></div>
    ${list.length?`<div class="tablewrap"><table class="cmp"><thead><tr><th>Competência</th>${list.map(i=>`<th><button class="btn sm ghost" data-go="parecer" data-id="${i.id}">${esc(i.candidato)}</button></th>`).join('')}</tr></thead><tbody>
      ${comps.map(c=>`<tr><td><b>${esc(c)}</b></td>${list.map(i=>{const x=i.competencias.find(k=>k.nome===c);return `<td>${x&&x.nivel?`<span class="lv ${x.nivel}">${NIVEL_CURTO[x.nivel]}</span>`:x&&x.sug?`<span class="lv sem">Sugestão: ${NIVEL_CURTO[x.sug.nivel]}</span>`:'<span class="muted small">sem avaliação</span>'}</td>`}).join('')}</tr>`).join('')}
      <tr><td><b>Resumo</b></td>${list.map(i=>`<td>${avg(i)}</td>`).join('')}</tr>
      <tr><td class="small muted">Duração</td>${list.map(i=>`<td class="small">${fmt(i.duracao)}</td>`).join('')}</tr>
      <tr><td class="small muted">Comentários de pares</td>${list.map(i=>`<td class="small">${i.pares.length}</td>`).join('')}</tr>
    </tbody></table></div><p class="xs muted">O comparativo usa a avaliação final de cada competência. Indícios de emoção não entram na comparação.</p>`:'<p class="muted">Nenhuma entrevista concluída para esta vaga ainda.</p>'}
  </div>`;
  $('#cmpV').onchange=e=>{vComparar.sel=e.target.value;vComparar()};
}

/* ---------- MODELOS DE PARECER ---------- */
let tplSelId=null;
function vModelos(){
  if(!S.templates.find(t=>t.id===tplSelId)) tplSelId=(S.templates.find(t=>t.padrao)||S.templates[0]).id;
  const t=S.templates.find(x=>x.id===tplSelId);
  app.innerHTML=`<div class="row" style="margin-bottom:16px"><h1 style="flex:1">Modelos de parecer</h1></div>
  <div class="grid2" style="align-items:start">
    <div class="stack">
      <div class="card"><h3 style="margin-bottom:6px">Seus modelos</h3>
        ${S.templates.map(x=>`<div class="list-item"><div style="flex:1;min-width:140px"><b>${esc(x.nome)}</b><div class="xs muted">${x.secoes.filter(s=>s.ativa).length} tópicos ativos</div></div>${x.padrao?'<span class="pill terra">Padrão</span>':''}<button class="btn sm ${x.id===tplSelId?'dark':''}" data-tsel="${x.id}">${x.id===tplSelId?'Editando':'Editar'}</button></div>`).join('')}
        <button class="btn sm ghost" id="tNew" style="margin-top:8px">+ Modelo em branco</button></div>
      <div class="card stack"><h3>Importar do seu parecer</h3>
        <p class="small muted">Envie um parecer que você já usa (.docx ou .txt) ou cole o texto. A IA identifica os títulos e o estilo de escrita e cria um modelo.</p>
        <label class="btn sm ghost" style="cursor:pointer;align-self:flex-start">Enviar arquivo<input type="file" id="tFile" accept=".docx,.txt,text/plain" class="sr"></label>
        <label class="sr" for="tPaste">Texto do parecer</label><textarea id="tPaste" placeholder="Cole aqui um parecer de exemplo"></textarea>
        <p id="tErr" class="small" style="color:#A3301E;min-height:18px"></p>
        <button class="btn primary" id="tImport">${icon('spark')} Criar modelo a partir do exemplo</button>
        <p class="xs muted">Dica: remova nomes e dados pessoais do exemplo antes de enviar. Só a estrutura e o estilo são usados.</p></div>
    </div>
    <div class="card stack">
      <div><label class="f" for="tNome">Nome do modelo</label><input id="tNome" type="text" value="${esc(t.nome)}"></div>
      <div><label class="f" for="tEst">Guia de estilo (como a IA deve escrever)</label><textarea id="tEst" style="min-height:120px">${esc(t.estilo)}</textarea></div>
      <div class="row"><h3 style="flex:1">Tópicos</h3><button class="btn sm ghost" id="tAddSec">+ Tópico</button></div>
      <div id="tSecs">${t.secoes.map((s,k)=>`<div style="border-top:1px solid var(--line);padding:12px 0">
        <div class="row"><input type="text" data-stit="${k}" value="${esc(s.titulo)}" aria-label="Título do tópico" style="font-weight:700;flex:1;min-width:160px"><label class="switch" title="Ativo"><input type="checkbox" data-sat="${k}" ${s.ativa?'checked':''} aria-label="Tópico ativo"><span></span></label></div>
        <textarea data-sins="${k}" aria-label="Instrução do tópico" style="margin-top:6px;min-height:70px;font-size:14px" placeholder="O que a IA deve escrever neste tópico">${esc(s.instrucao)}</textarea>
        <div class="row" style="margin-top:6px"><button class="btn sm ghost" data-sup="${k}" ${k===0?'disabled':''}>Subir</button><button class="btn sm ghost" data-sdel="${k}">Remover</button></div></div>`).join('')}</div>
      <div><label class="f" for="tRod">Rodapé</label><input id="tRod" type="text" value="${esc(t.rodape||'')}" placeholder="Este parecer é confidencial e não deverá ser compartilhado."></div>
      <div class="row">${t.padrao?'<span class="pill terra">Modelo padrão</span>':'<button class="btn sm" id="tPad">Definir como padrão</button>'}<button class="btn sm ghost" id="tDup">Duplicar</button>${S.templates.length>1?'<button class="btn sm danger" id="tDel">Excluir</button>':''}<span class="spacer"></span><span class="xs muted">Salvo automaticamente</span></div>
    </div>
  </div>`;
  const sv=()=>save();
  app.querySelectorAll('[data-tsel]').forEach(b=>b.onclick=()=>{tplSelId=b.dataset.tsel;vModelos()});
  $('#tNome').oninput=e=>{t.nome=e.target.value;sv()}; $('#tEst').oninput=e=>{t.estilo=e.target.value;sv()}; $('#tRod').oninput=e=>{t.rodape=e.target.value;sv()};
  app.querySelectorAll('[data-stit]').forEach(x=>x.oninput=()=>{t.secoes[+x.dataset.stit].titulo=x.value;sv()});
  app.querySelectorAll('[data-sins]').forEach(x=>x.oninput=()=>{t.secoes[+x.dataset.sins].instrucao=x.value;sv()});
  app.querySelectorAll('[data-sat]').forEach(x=>x.onchange=()=>{t.secoes[+x.dataset.sat].ativa=x.checked;sv()});
  app.querySelectorAll('[data-sup]').forEach(b=>b.onclick=()=>{const k=+b.dataset.sup;if(k>0){[t.secoes[k-1],t.secoes[k]]=[t.secoes[k],t.secoes[k-1]];sv();vModelos()}});
  app.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{t.secoes.splice(+b.dataset.sdel,1);sv();vModelos()});
  $('#tAddSec').onclick=()=>{t.secoes.push({id:'s'+Date.now(),titulo:'Novo tópico',instrucao:'',ativa:true});sv();vModelos()};
  $('#tNew').onclick=()=>{const n={id:'t'+Date.now(),nome:'Novo modelo',padrao:false,estilo:'Terceira pessoa, linguagem formal e objetiva.',rodape:'',secoes:[{id:'s'+Date.now(),titulo:'Conclusão',instrucao:'',ativa:true}]};S.templates.push(n);tplSelId=n.id;sv();vModelos()};
  const pd=$('#tPad'); if(pd) pd.onclick=()=>{S.templates.forEach(x=>x.padrao=x.id===t.id);sv();vModelos();toast('Modelo padrão definido')};
  $('#tDup').onclick=()=>{const n=JSON.parse(JSON.stringify(t));n.id='t'+Date.now();n.nome=t.nome+' (cópia)';n.padrao=false;S.templates.push(n);tplSelId=n.id;sv();vModelos()};
  const dl=$('#tDel'); if(dl) dl.onclick=()=>confirmBox(`Excluir o modelo "${t.nome}"?`,'Excluir',()=>{S.templates=S.templates.filter(x=>x.id!==t.id);if(!S.templates.some(x=>x.padrao))S.templates[0].padrao=true;sv();vModelos()});
  $('#tPaste').oninput=()=>$('#tErr').textContent='';
  $('#tFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const tx=/\.docx$/i.test(f.name)?await docxText(f):await f.text();$('#tPaste').value=tx;toast('Arquivo carregado')}catch(err){$('#tErr').textContent='Não consegui ler esse arquivo. Cole o texto no campo.'}};
  $('#tImport').onclick=async e=>{
    const tx=$('#tPaste').value.trim(); if(tx.length<40){$('#tErr').textContent='Envie um arquivo ou cole um parecer de exemplo.';return}
    const b=e.currentTarget; b.innerHTML='<span class="spin"></span> Analisando o exemplo…'; b.disabled=true;
    let n=null;
    try{
      const r=await ai(`Analise o parecer de exemplo abaixo e extraia um MODELO reutilizável, em português do Brasil. Identifique os títulos dos tópicos na ordem em que aparecem e, para cada um, escreva uma instrução curta do que deve ser escrito ali (sem copiar dados da pessoa). Descreva o estilo de escrita (pessoa verbal, formalidade, tamanho dos parágrafos, expressões recorrentes) para que outra IA escreva igual. Identifique um rodapé fixo, se houver. Ignore nomes de pessoas.
Exemplo:
${tx.slice(0,12000)}
Responda só em JSON: {"nome":"nome curto do modelo","estilo":"...","rodape":"... ou vazio","topicos":[{"titulo":"...","instrucao":"..."}]}`,true);
      if(r&&Array.isArray(r.topicos)&&r.topicos.length) n={nome:String(r.nome||'Modelo importado'),estilo:String(r.estilo||''),rodape:String(r.rodape||''),secoes:r.topicos.map((s,k)=>({id:'s'+Date.now()+k,titulo:String(s.titulo),instrucao:String(s.instrucao||''),ativa:true}))};
      else throw {code:'bad'};
    }catch(err){
      aiErr(err);
      const lines=tx.split(/\n+/).map(l=>l.trim()).filter(Boolean);
      const heads=lines.filter(l=>l.length<70&&!/[.;]$/.test(l.replace(/:$/,''))&&l.split(' ').length<=8&&(/:$/.test(l)||/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ]/.test(l))).map(l=>l.replace(/:$/,''));
      const uniq=[...new Set(heads)].slice(1,12);
      n={nome:'Modelo importado',estilo:'Terceira pessoa, linguagem formal e objetiva, em parágrafos corridos.',rodape:'',secoes:(uniq.length?uniq:['Conclusão']).map((h,k)=>({id:'s'+Date.now()+k,titulo:h,instrucao:'',ativa:true}))};
    }
    n.id='t'+Date.now(); n.padrao=false;
    if(n.secoes.some(s=>/pessoa|famil/i.test(s.titulo))) n.secoes.forEach(s=>{if(/pessoa|famil/i.test(s.titulo)){s.ativa=false;s.instrucao=(s.instrucao?s.instrucao+' ':'')+'Atenção: estado civil e situação familiar não podem ser critério de seleção (Lei 9.029/95).'}});
    S.templates.push(n); tplSelId=n.id; save(); vModelos(); toast('Modelo criado. Revise os tópicos.');
  };
}
function loadScript(src){return new Promise((res,rej)=>{if(loadScript[src])return res();const s=document.createElement('script');s.src=src;s.onload=()=>{loadScript[src]=1;res()};s.onerror=rej;document.head.appendChild(s)})}
async function docxText(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const zip=await JSZip.loadAsync(file); const xml=await zip.file('word/document.xml').async('string');
  return xml.split(/<\/w:p>/).map(p=>p.replace(/<w:tab\/>/g,' ').replace(/<[^>]+>/g,'')).map(t=>t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").trim()).filter(Boolean).join('\n');
}

/* ---------- LGPD ---------- */
function vLgpd(){
  const st=S.settings; const days=ms=>Math.floor((Date.now()-ms)/864e5);
  app.innerHTML=`<div class="row" style="margin-bottom:16px"><h1>Painel LGPD</h1></div>
  <div class="grid2" style="align-items:start">
    <div class="card stack"><h3>Configurações do termo</h3>
      <div><label class="f" for="sE">Empresa</label><input id="sE" type="text" value="${esc(st.empresa)}"></div>
      <div><label class="f" for="sC">E-mail para pedidos do titular</label><input id="sC" type="text" value="${esc(st.contato)}"></div>
      <div><label class="f" for="sS">Endereço do site (para o link do candidato)</label><input id="sS" type="text" value="${esc(st.site||'')}" placeholder="https://mateusdesleal-ops.github.io/Nuance/"></div>
      <div><label class="f" for="sR">Retenção (dias)</label><input id="sR" type="number" min="1" max="365" step="1" value="${esc(st.retencao)}"></div>
      <p id="sErr" class="small" style="color:#A3301E;min-height:18px"></p>
      <button class="btn primary" id="sSave">Salvar</button>
      <p class="xs muted">Esses dados aparecem no termo que o candidato vê antes de entrar.</p>
    </div>
    <div class="card"><h3 style="margin-bottom:8px">Aceites registrados</h3>
      ${S.consents.length?[...S.consents].reverse().map(c=>`<div class="list-item"><div style="flex:1;min-width:160px"><b>${esc(c.candidato)}</b><div class="xs muted">${new Date(c.at).toLocaleString('pt-BR')} · ${esc(c.code)} · termo v${esc(c.versao)}${c.simulado?' · simulado':''}</div></div><span class="pill ${c.choice==='full'?'ok':'blue'}">${c.choice==='full'?'Autorizou análise':'Só gravação'}</span></div>`).join(''):'<p class="muted small">Nenhum aceite ainda.</p>'}
    </div>
  </div>
  <div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">Dados por entrevista</h3>
    ${S.interviews.map(i=>{const d=days(i.createdAt),exp=d>=st.retencao;return `<div class="list-item"><div style="flex:1;min-width:160px"><b>${esc(i.candidato)}</b><div class="xs muted">${esc(i.vaga)} · criada há ${d} dia${d===1?'':'s'} · ${i.transcript.length} falas · ${i.indicios.length} indícios</div></div>${exp?'<span class="pill warn">Prazo vencido</span>':`<span class="pill gray">Expira em ${st.retencao-d} dias</span>`}<button class="btn sm ghost" data-exp="${i.id}">${icon('copy')} Copiar dados</button><button class="btn sm danger" data-del="${i.id}">Excluir</button></div>`}).join('')||'<p class="muted small">Sem dados.</p>'}
  </div>`;
  $('#sSave').onclick=()=>{const r=parseInt($('#sR').value,10); if(!$('#sE').value.trim()||!$('#sC').value.trim()){$('#sErr').textContent='Preencha empresa e e-mail.';return} if(!(r>=1&&r<=365)){$('#sErr').textContent='Retenção entre 1 e 365 dias.';return} st.empresa=$('#sE').value.trim();st.site=$('#sS').value.trim()||st.site;st.contato=$('#sC').value.trim();st.retencao=r;save();toast('Configurações salvas');vLgpd()};
  ['#sE','#sC','#sR'].forEach(s=>$(s).addEventListener('input',()=>$('#sErr').textContent=''));
  app.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{const i=S.interviews.find(x=>x.id===b.dataset.exp);copy(JSON.stringify({candidato:i.candidato,vaga:i.vaga,consentimento:S.consents.filter(c=>c.iid===i.id),transcricao:i.transcript,indicios:i.indicios,marcacoes:i.marks,parecer:i.parecer},null,2))});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=S.interviews.find(x=>x.id===b.dataset.del);confirmBox(`Excluir todos os dados de ${i.candidato}?`,'Excluir',()=>{S.interviews=S.interviews.filter(x=>x.id!==i.id);save();toast('Dados excluídos');vLgpd()})});
}

applyMode(); go(isCand()?'candidato':'home');
</script>
